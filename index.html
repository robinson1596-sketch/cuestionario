<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Objetivos, inversión y retorno · MasterKing</title>
<meta name="description" content="Cuestionario breve para definir objetivos, inversión y retorno de su estrategia de marketing digital.">
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="Objetivos, inversión y retorno · MasterKing">
<meta property="og:description" content="Doce preguntas, unos siete minutos, para definir metas realistas de marketing digital.">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--black:#0b0a10;--purple:#6d28d9;--purple-d:#4c1d95;--lav:#f3eefb;--card:#fff;--ink:#17131f;--muted:#5f5872;--line:#e2daf1;--onblack:#f4f0fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#17131f;--ink:#f4f0fb;--muted:#b3aac8;--line:#2f2745;--lav:#211a33;--purple:#a78bfa}}
:root[data-theme="dark"]{--card:#17131f;--ink:#f4f0fb;--muted:#b3aac8;--line:#2f2745;--lav:#211a33;--purple:#a78bfa}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--black);color:var(--ink);font-family:Manrope,system-ui,Arial,sans-serif;line-height:1.55;min-height:100vh}
header{max-width:720px;margin:0 auto;padding:36px 22px 8px;color:var(--onblack)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.18em;font-size:.8rem;color:#c4b5fd}
.brand svg{width:26px;height:26px}
h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.15;margin:22px 0 10px;font-weight:700}
header p{margin:0;color:#c9c0dc;max-width:52ch}
main{max-width:720px;margin:0 auto;padding:20px 16px 56px}
.card{background:var(--card);border-radius:14px;padding:26px 22px;border-top:4px solid var(--purple)}
.prog{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-bottom:8px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:24px}
.bar i{display:block;height:100%;background:var(--purple);transition:width .3s}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-family:"Playfair Display",Georgia,serif;font-size:1.35rem;line-height:1.3;font-weight:600;padding:0;margin-bottom:6px}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:9px;cursor:pointer;min-height:48px}
.opt:hover{border-color:var(--purple)}
.opt input{margin-top:3px;accent-color:var(--purple);width:18px;height:18px;flex:none}
.opt:has(input:checked){border-color:var(--purple);background:var(--lav)}
.opt:has(input:focus-visible){outline:3px solid var(--purple);outline-offset:2px}
label.f{display:block;font-size:.85rem;font-weight:600;margin:14px 0 5px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
textarea{min-height:110px;resize:vertical}
input[type=text]:focus,textarea:focus{outline:3px solid var(--purple);outline-offset:1px}
.err{color:#c2410c;font-size:.88rem;min-height:1.3em;margin:8px 0 0}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
button{font:inherit;font-weight:600;border-radius:10px;padding:13px 22px;min-height:48px;cursor:pointer;border:1px solid var(--purple)}
.pri{background:var(--purple-d);color:#fff;border-color:var(--purple-d)}
.pri:hover{background:var(--purple);border-color:var(--purple)}
.sec{background:transparent;color:var(--ink);border-color:var(--line)}
button:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
button[hidden]{display:none}
.done h2{font-family:"Playfair Display",Georgia,serif;margin:0 0 8px;font-size:1.5rem}
.done textarea{min-height:230px;font-size:.85rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
footer{max-width:720px;margin:0 auto;padding:0 22px 40px;color:#8f85a8;font-size:.82rem}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<header>
<div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 24 2 9l7 6 7-10 7 10 7-6-2 15z" fill="#a78bfa"/><rect x="5" y="26" width="22" height="3" rx="1.5" fill="#6d28d9"/></svg>MASTERKING</div>
<h1>Objetivos, inversión y retorno: definamos qué es realista</h1>
<p>Doce preguntas, unos siete minutos. Con sus respuestas fijamos metas alcanzables y una inversión que tenga sentido para GEMS.</p>
</header>
<main><div class="card" id="card"></div></main>
<footer>MasterKing · Marketing digital y desarrollo web</footer>
<script>
var CFG={wa:"573012533791",endpoint:""};
var Q=[
{id:"obj",t:"single",q:"¿Qué quiere lograr principalmente con el marketing digital?",o:["Más solicitudes de cotización calificadas","Cerrar más proyectos con las solicitudes que ya llegan","Vender más un servicio específico","Entrar a nuevos sectores o regiones","Posicionar a GEMS como referente técnico"]},
{id:"serv",t:"multi",max:3,q:"¿Qué servicios quiere vender primero?",h:"Elija hasta 3. Empezar con pocos permite medir mejor el retorno.",o:["Permisos y estudios ambientales","Monitoreos ambientales y de higiene ocupacional","Equipos, puesta en marcha y capacitación","Modelaciones","Sostenibilidad, clima y ESG","Auditorías y sistemas de gestión","Ingeniería ambiental","SIG, geodatos y SST"]},
{id:"cli",t:"multi",q:"¿Qué tipo de cliente quiere atraer?",h:"Puede elegir varios.",o:["Industria","Agroindustria","Infraestructura","Servicios","Entidades públicas","Otro"]},
{id:"tic",t:"single",q:"¿Cuál es el valor típico de un proyecto en los servicios que quiere vender?",h:"Una aproximación basta. De esta cifra depende cuánto se puede invertir con sentido.",o:["Menos de $5.000.000 COP","Entre $5.000.000 y $20.000.000 COP","Entre $20.000.000 y $50.000.000 COP","Entre $50.000.000 y $150.000.000 COP","Más de $150.000.000 COP","Varía mucho según el servicio"]},
{id:"cierre",t:"single",q:"De cada 10 solicitudes serias de cotización, ¿cuántas terminan en contrato hoy?",o:["Entre 0 y 1","Entre 2 y 3","Entre 4 y 5","6 o más","No lo medimos todavía"]},
{id:"ciclo",t:"single",q:"¿Cuánto tarda normalmente desde el primer contacto hasta firmar?",h:"Este dato define en qué plazo se puede esperar retorno.",o:["Hasta 2 semanas","Entre 2 y 6 semanas","Entre 1 y 3 meses","Más de 3 meses"]},
{id:"cap",t:"single",q:"¿Cuántos proyectos nuevos al mes podría asumir sin bajar la calidad?",o:["1 o 2","De 3 a 5","De 6 a 10","Más de 10","No lo tengo claro"]},
{id:"meta",t:"single",q:"¿Cuántos ingresos nuevos quiere que el marketing le aporte en 12 meses?",h:"Solo lo que llegue por canales digitales, sin contar clientes actuales.",o:["Menos de $50.000.000 COP","Entre $50.000.000 y $150.000.000 COP","Entre $150.000.000 y $400.000.000 COP","Más de $400.000.000 COP","No lo he definido"]},
{id:"inv",t:"single",q:"¿Cuánto puede destinar al mes a publicidad (Google y Meta)?",h:"Solo la pauta, sin honorarios. No hay respuesta incorrecta: define qué es realista.",o:["Aún no lo he definido","Menos de $1.000.000 COP","Entre $1.000.000 y $3.000.000 COP","Entre $3.000.000 y $6.000.000 COP","Más de $6.000.000 COP"]},
{id:"plazo",t:"single",q:"¿En cuánto tiempo espera recuperar lo invertido?",o:["En los primeros 3 meses","En 6 meses","En 12 meses","No lo he definido"]},
{id:"exito",t:"text",q:"Describa el resultado que, dentro de 6 meses, le haría decir que valió la pena.",h:"Con cifras si puede: proyectos, clientes o ingresos."},
{id:"con",t:"contact",q:"¿Con quién hablamos?"}
];
var S={},step=0,card=document.getElementById("card");
var CL={obj:"Objetivo principal",serv:"Servicios a vender primero",cli:"Clientes objetivo",tic:"Valor típico de un proyecto",cierre:"Cierre actual (de cada 10 solicitudes serias)",ciclo:"Tiempo hasta firmar",cap:"Proyectos nuevos al mes que puede asumir",meta:"Ingresos nuevos esperados en 12 meses",inv:"Inversión mensual en pauta",plazo:"Plazo esperado de recuperación",exito:"Resultado esperado a 6 meses"};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
var q=Q[step],pct=Math.round(step/Q.length*100),h='<div class="prog" aria-live="polite"><span>Pregunta '+(step+1)+' de '+Q.length+'</span><span>'+pct+'%</span></div><div class="bar"><i style="width:'+pct+'%"></i></div><fieldset><legend>'+esc(q.q)+'</legend>';
if(q.h)h+='<p class="hint">'+esc(q.h)+'</p>';
if(q.t==="single"||q.t==="multi"){var sel=S[q.id]||[];q.o.forEach(function(o,i){h+='<label class="opt"><input type="'+(q.t==="single"?"radio":"checkbox")+'" name="q" value="'+i+'"'+(sel.indexOf(o)>-1?" checked":"")+'><span>'+esc(o)+'</span></label>'});}
if(q.t==="text")h+='<label class="f" for="tx">Su respuesta</label><textarea id="tx">'+esc(S[q.id]||"")+'</textarea>';
if(q.t==="contact"){var c=S.con||{};h+='<label class="f" for="n">Nombre</label><input type="text" id="n" autocomplete="name" value="'+esc(c.n||"")+'"><label class="f" for="r">Cargo</label><input type="text" id="r" autocomplete="organization-title" value="'+esc(c.r||"")+'"><label class="f" for="e">Empresa</label><input type="text" id="e" autocomplete="organization" value="'+esc(c.e||"")+'"><label class="f" for="m">Correo o WhatsApp</label><input type="text" id="m" autocomplete="email" value="'+esc(c.m||"")+'">';}
h+='</fieldset><p class="err" id="err" role="alert"></p><div class="nav"><button class="sec" id="bk"'+(step?"":" hidden")+'>Atrás</button><button class="pri" id="nx">'+(step===Q.length-1?"Ver resumen":"Continuar")+'</button></div>';
card.innerHTML=h;card.scrollIntoView({block:"start"});
document.getElementById("nx").onclick=next;
var b=document.getElementById("bk");if(b)b.onclick=function(){save();step--;render()};
card.querySelectorAll('input[type=checkbox]').forEach(function(x){x.onchange=function(){var n=card.querySelectorAll('input[type=checkbox]:checked');if(q.max&&n.length>q.max){x.checked=false;document.getElementById("err").textContent="Puede elegir hasta "+q.max+"."}else document.getElementById("err").textContent=""}});
}
function val(id){return document.getElementById(id).value.trim()}
function save(){var q=Q[step];
if(q.t==="single"||q.t==="multi"){S[q.id]=[].map.call(card.querySelectorAll("input[name=q]:checked"),function(x){return q.o[+x.value]})}
if(q.t==="text")S[q.id]=val("tx");
if(q.t==="contact")S.con={n:val("n"),r:val("r"),e:val("e"),m:val("m")};}
function next(){save();var q=Q[step],e="";
if((q.t==="single"||q.t==="multi")&&!S[q.id].length)e="Elija al menos una opción.";
if(q.t==="text"&&S[q.id].length<10)e="Cuéntenos un poco más para poder ayudarle.";
if(q.t==="contact"&&(!S.con.n||!S.con.e||!S.con.m))e="Complete nombre, empresa y un medio de contacto.";
if(e){document.getElementById("err").textContent=e;return}
if(step<Q.length-1){step++;render()}else done()}
function summary(){var c=S.con,t="OBJETIVOS, INVERSIÓN Y RETORNO · GEMS\n\n";
Q.slice(0,-1).forEach(function(q){var a=S[q.id];t+=CL[q.id]+": "+(Array.isArray(a)?a.join(", "):a)+"\n"});
return t+"\nContacto: "+c.n+(c.r?" ("+c.r+")":"")+" · "+c.e+" · "+c.m}
function done(){var s=summary();
if(CFG.endpoint){try{fetch(CFG.endpoint,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({resumen:s,nombre:S.con.n,empresa:S.con.e,contacto:S.con.m})}).catch(function(){})}catch(x){}}
card.innerHTML='<div class="done"><h2>Gracias, '+esc(S.con.n.split(" ")[0])+'</h2><p class="hint">Este es el resumen de sus respuestas. Para que llegue a MasterKing, toque «Enviar por WhatsApp» y luego envíe el mensaje.</p><label class="f" for="sm">Resumen</label><textarea id="sm" readonly>'+esc(s)+'</textarea><div class="actions"><a id="wa" class="pri" style="text-decoration:none;border:1px solid var(--purple-d);border-radius:10px;padding:13px 22px;min-height:48px;display:inline-flex;align-items:center;font-weight:600" target="_blank" rel="noopener" href="https://wa.me/'+CFG.wa+'?text='+encodeURIComponent(s)+'">Enviar por WhatsApp</a><button class="sec" id="cp">Copiar resumen</button><button class="sec" id="ed">Editar respuestas</button></div><p class="err" id="err"></p></div>';
card.scrollIntoView({block:"start"});
document.getElementById("cp").onclick=function(){var t=document.getElementById("sm");t.select();var ok=false;try{ok=document.execCommand("copy")}catch(x){}
if(!ok&&navigator.clipboard){navigator.clipboard.writeText(s).then(function(){document.getElementById("err").textContent="Copiado."}).catch(function(){document.getElementById("err").textContent="Seleccione el texto y cópielo."});return}
document.getElementById("err").textContent=ok?"Copiado.":"Seleccione el texto y cópielo."};
document.getElementById("ed").onclick=function(){step=0;render()}}
render();
</script>
</body>
</html>
